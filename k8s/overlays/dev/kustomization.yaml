apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zeiterfassung-dev
labels:
  - pairs:
      app.kubernetes.io/environment: dev
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: zeiterfassung
    count: 1
images:
  - name: zeiterfassung
    newTag: "1.3"
patches:
  - path: service-nodeport.yaml
