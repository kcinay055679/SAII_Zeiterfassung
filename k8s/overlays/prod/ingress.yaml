apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeiterfassung
spec:
  ingressClassName: traefik
  rules:
    - host: zeiterfassung.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeiterfassung
                port:
                  name: http
