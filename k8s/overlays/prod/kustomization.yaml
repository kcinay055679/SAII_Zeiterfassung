apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zeiterfassung-prod
labels:
  - pairs:
      app.kubernetes.io/environment: prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
replicas:
  - name: zeiterfassung
    count: 3
images:
  - name: zeiterfassung
    newName: k3d-registry.localhost:5050/zeiterfassung
    newTag: "1.2"
patches:
  - path: resources-patch.yaml
