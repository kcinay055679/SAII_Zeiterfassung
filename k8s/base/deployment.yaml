apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeiterfassung
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeiterfassung
  template:
    metadata:
      labels:
        app: zeiterfassung
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: zeiterfassung:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: daten
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: daten
          persistentVolumeClaim:
            claimName: zeiterfassung-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
