global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: lm2-node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: kunde
          host: LM2

  - job_name: zeiterfassung
    static_configs:
      - targets: ["zeiterfassung:8080"]
        labels:
          environment: kunde
          host: LM2
